spring:
  application:
    name: vshop-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15433/vshop}
    username: ${DB_USER:vshop}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/vshop}
          audiences: vshop-api
  jackson:
    time-zone: UTC
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: WARN
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-}] "
debug: false
