spring:
  application:
    name: vshop-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15433/vshop}
    username: ${DB_USER:vshop}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/vshop}
          audiences: vshop-api
  jackson:
    time-zone: UTC
    deserialization:
      # Money is integer VND; reject 1000.5 instead of silently truncating it.
      accept-float-as-int: false
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: WARN
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-}] "
debug: false
vshop:
  security:
    # ADMIN tokens must carry amr=otp (Keycloak OTP form). Disable only in isolated tests.
    admin-mfa-required: true
  payment:
    # Public address of the web app: where VNPay sends the customer back after paying.
    return-base-url: ${WEB_BASE_URL:http://localhost:3100}
    vnpay:
      # Sandbox merchant credentials from VNPay. Empty means online payment is unavailable and
      # orders can only be placed as COD. Never commit real values.
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  pii:
    # Application-level encryption of personal data (phone, street). One id per key; new values use
    # active-key and old ids stay readable, so keys can be rotated. Provide the 32-byte base64 key
    # through the environment (scripts/init-local.ps1 generates one locally).
    active-key: local-1
    keys:
      local-1: ${PII_KEY_LOCAL_1:}
springdoc:
  api-docs:
    # The OpenAPI document is generated by a test and committed (docs/api/openapi.json). It is never
    # served by the running API; tests switch it on with springdoc.api-docs.enabled=true.
    enabled: false
  swagger-ui:
    enabled: false
  default-flat-param-object: true
