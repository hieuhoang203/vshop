spring:
  application:
    name: vshop-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15433/vshop}
    username: ${DB_USER:vshop}
    password: ${DB_PASSWORD}
  flyway:
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/vshop}
          audiences: vshop-api
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  jackson:
    time-zone: UTC
    deserialization:
      # Money is integer VND; reject 1000.5 instead of silently truncating it.
      accept-float-as-int: false
server:
  port: ${PORT:8081}
  error:
    include-message: never
    include-stacktrace: never
management:
  health:
    redis:
      # Redis only backs rate limits; the API must stay up (and report UP) without it.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.security: WARN
  pattern:
    correlation: "[${spring.application.name:},%X{correlationId:-}] "
debug: false
vshop:
  security:
    # ADMIN tokens must carry amr=otp (Keycloak OTP form). Disable only in isolated tests.
    admin-mfa-required: true
  payment:
    # Public address of the web app: where VNPay sends the customer back after paying.
    return-base-url: ${WEB_BASE_URL:http://localhost:3100}
    # Which provider new online payments use: payos or vnpay. Callbacks of both are always accepted.
    provider: ${PAYMENT_PROVIDER:payos}
    payos:
      # payOS has no sandbox: credentials here are real. Never commit real values.
      base-url: ${PAYOS_BASE_URL:https://api-merchant.payos.vn}
      client-id: ${PAY_OS_CLIENT_ID:}
      api-key: ${PAY_OS_API_KEY:}
      checksum-key: ${PAY_OS_CHECKSUM_KEY:}
    vnpay:
      # Sandbox merchant credentials from VNPay. Empty means online payment is unavailable and
      # orders can only be placed as COD. Never commit real values.
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
  identity:
    keycloak:
      # Admin API access for self-service sign-up. The secret exists only in the environment.
      base-url: ${KEYCLOAK_BASE_URL:http://localhost:8180}
      realm: ${KEYCLOAK_REALM:vshop}
      client-id: vshop-provisioner
      client-secret: ${KEYCLOAK_PROVISIONER_SECRET:}
  web:
    # Public address of the web app, used for links inside emails.
    base-url: ${WEB_BASE_URL:http://localhost:3100}
  email:
    # Sender shown in notification emails, for example "VShop <no-reply@yourdomain.vn>". Empty
    # (or no SMTP host) switches email notifications off. Any SMTP provider works; credentials only
    # through the environment.
    from: ${EMAIL_FROM:}
    smtp:
      host: ${SMTP_HOST:}
      port: ${SMTP_PORT:587}
      username: ${SMTP_USERNAME:}
      password: ${SMTP_PASSWORD:}
      starttls: ${SMTP_STARTTLS:true}
  shipping:
    ghtk:
      # GHTK staging until production access is granted. An empty token or partner code means the
      # carrier is not configured and shops use manual shipping. Never commit real values.
      base-url: ${GHTK_BASE_URL:https://services-staging.ghtklab.com}
      token: ${GHTK_TOKEN:}
      partner-code: ${GHTK_PARTNER_CODE:}
      # The secret GHTK puts in the webhook URL (?hash=...). Choose a long random value.
      webhook-token: ${GHTK_WEBHOOK_TOKEN:}
  pii:
    # Application-level encryption of personal data (phone, street). One id per key; new values use
    # active-key and old ids stay readable, so keys can be rotated. Provide the 32-byte base64 key
    # through the environment (scripts/init-local.ps1 generates one locally).
    active-key: local-1
    keys:
      local-1: ${PII_KEY_LOCAL_1:}
springdoc:
  api-docs:
    # The OpenAPI document is generated by a test and committed (docs/api/openapi.json). It is never
    # served by the running API; tests switch it on with springdoc.api-docs.enabled=true.
    enabled: false
  swagger-ui:
    enabled: false
  default-flat-param-object: true
