_format_version: "3.0"
services:
  - name: vshop-api
    url: http://host.docker.internal:8081
    routes:
      - name: api
        paths: [/api]
        strip_path: false
plugins:
  - name: correlation-id
    config:
      header_name: X-Correlation-ID
      generator: uuid
      echo_downstream: true
  - name: rate-limiting
    config:
      minute: 120
      policy: local
