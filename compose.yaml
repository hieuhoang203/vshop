name: vshop
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: vshop
      POSTGRES_USER: vshop
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Run scripts/init-local.ps1 first}
    ports: ["127.0.0.1:15433:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vshop -d vshop"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run scripts/init-local.ps1 first}
    volumes: ["keycloak-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: vshop-local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run scripts/init-local.ps1 first}
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8180:8080", "127.0.0.1:9180:9000"]
    volumes: ["./.local/keycloak/vshop-realm.json:/opt/keycloak/data/import/vshop-realm.json:ro"]
    depends_on:
      keycloak-db: { condition: service_healthy }
  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--requirepass",
        "${REDIS_PASSWORD:?Run scripts/init-local.ps1 first}",
      ]
    ports: ["127.0.0.1:6380:6379"]
    volumes: ["redis-data:/data"]
  storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["media"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: vshop-local
      MINIO_ROOT_PASSWORD: ${STORAGE_PASSWORD}
    ports: ["127.0.0.1:9100:9000", "127.0.0.1:9101:9001"]
    volumes: ["storage-data:/data"]
  gateway:
    image: kong:3.9.1
    profiles: ["gateway"]
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/declarative/kong.yml
      KONG_ADMIN_LISTEN: "off"
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["./infra/kong/kong.yml:/kong/declarative/kong.yml:ro"]
volumes:
  postgres-data:
  keycloak-data:
  redis-data:
  storage-data:
