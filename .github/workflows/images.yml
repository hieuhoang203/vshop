name: Build container images
# Manual only: nothing is published until someone starts this workflow. It builds the API and web
# images and pushes them to this repository's GitHub Container Registry (private by default).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag (for example 2026-11-21 or a commit id)
        required: true
permissions:
  contents: read
  packages: write
jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository }}/api:${{ inputs.tag }}
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/web:${{ inputs.tag }}
